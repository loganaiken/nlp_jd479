[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loganaiken-nlp_jd479"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出NLP 算法工程师·成本与吞吐的帕累托边界上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "loganaiken" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://loganaiken.github.io"
Repository = "https://github.com/loganaiken/nlp_jd479"
Issues = "https://github.com/loganaiken/nlp_jd479/issues"

[project.scripts]
nlp_jd479 = "nlp_jd479:main"

[tool.setuptools]
py-modules = ["nlp_jd479"]
